name: Тесты и выкладка

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Java нужна эмулятору Firestore для тестов правил безопасности
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run test:rules
      - run: npm run build

  deploy:
    name: Выкладка в Firebase
    needs: test
    # Выкладываем только ветку по умолчанию (не pull request'ы и не другие ветки)
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://plumit-buh.web.app
    # id-token нужен для входа в Google без ключей (Workload Identity Federation)
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Вход в Google Cloud без ключа
        uses: google-github-actions/auth@v2
        with:
          # Создаётся скриптом scripts/setup-github-deploy.sh (см. README, «Автовыкладка»)
          workload_identity_provider: projects/981677926973/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@plumit-buh.iam.gserviceaccount.com
      - run: npm ci
      - run: npm run build
      # Правила хранилища файлов: если хранилище ещё не создано (нужен тариф Blaze) — предупреждение, сайт всё равно выкладывается
      - name: Правила хранилища файлов
        run: |
          if ! npx firebase deploy --only storage --non-interactive; then
            echo "::warning::Правила хранилища не выложены. Включите тариф Blaze, создайте Storage и запустите scripts/setup-storage.sh (README, «Документы-файлы»)"
          fi
      - name: Деплой (сайт + правила Firestore)
        run: npx firebase deploy --only hosting,firestore:rules --non-interactive
      - name: Подсказка
        if: failure()
        run: |
          echo "::error::Выкладка не удалась. Если это первый запуск — выполните scripts/setup-github-deploy.sh в Google Cloud Shell (README, раздел «Автовыкладка») и перезапустите workflow."
